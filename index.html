<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6e8e7">
<title>Melanni Valeria · XV</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; }
  body {
    min-height: 100svh; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(ellipse at center, #fffaf7 0%, #f6e8e7 58%, #ead5d2 100%);
  }
  .stage {
    position: relative; width: 100%; height: 100svh; min-height: 520px;
    display: grid; place-items: center; overflow: hidden; isolation: isolate;
  }
  .envelope {
    position: relative; height: min(96svh, 900px); width: min(100vw, 600px);
    display: grid; place-items: center; transform-origin: center;
    filter: drop-shadow(0 18px 30px rgba(93, 60, 43, .16));
    transition: transform 1.1s cubic-bezier(.2,.75,.25,1), opacity 1s ease, filter 1s ease;
  }
  .envelope img {
    display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
    object-fit: contain; user-select: none; -webkit-user-drag: none;
  }
  .seal-hit {
    position: absolute; left: 50%; top: 49%; transform: translate(-50%,-50%);
    width: clamp(92px, 23vw, 170px); aspect-ratio: 1; border: 0; border-radius: 50%;
    background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .seal-hit:focus-visible { outline: 2px solid #b28a42; outline-offset: 6px; }
  .hint {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; font: 500 10px/1.4 Georgia, serif; letter-spacing: 3px;
    color: #9d794b; opacity: .88; pointer-events: none;
    animation: hintPulse 2s ease-in-out infinite;
  }
  .sparkles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
  .spark {
    position: absolute; left: var(--x); top: var(--y); width: var(--size); height: var(--size);
    background: #fff8d8; border-radius: 50%; opacity: 0;
    box-shadow: 0 0 5px 2px #fff0ad, 0 0 15px 5px rgba(226,178,83,.72);
    animation: sparkle var(--duration) ease-out var(--delay) forwards;
  }
  .spark::before, .spark::after { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#fff7d4; border-radius:2px; }
  .spark::before { width:2px; height:calc(var(--size) * 3.4); }
  .spark::after { width:calc(var(--size) * 3.4); height:2px; }
  .stage.opening .envelope { transform: scale(1.07); filter: drop-shadow(0 0 28px rgba(225,177,76,.48)); }
  .stage.leaving .envelope { transform: scale(1.22); opacity: 0; filter: blur(5px); }
  .stage.leaving { background: radial-gradient(circle, #fffdf4 0%, #f5dfe1 55%, #e9c6ce 100%); }
  @keyframes sparkle {
    0% { opacity:0; transform:translateY(12px) scale(.15) rotate(0deg); }
    18% { opacity:1; }
    70% { opacity:.9; }
    100% { opacity:0; transform:translateY(-36px) scale(1.15) rotate(90deg); }
  }
  @keyframes hintPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    .hint { animation:none; }
    .spark { animation-duration: .4s !important; }
    .envelope { transition-duration: .2s; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Sobre de invitación de XV años">
    <div class="envelope" id="envelope">
      <img src="sobre-mv.png" alt="Sobre rosa con sello dorado, corona e iniciales MV">
      <button class="seal-hit" id="seal" aria-label="Abrir el sello de la invitación"></button>
    </div>
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>
    <div class="hint" id="hint">TOCA EL SELLO</div>
  </main>
<script>
(() => {
  const stage = document.getElementById('stage');
  const seal = document.getElementById('seal');
  const hint = document.getElementById('hint');
  const sparkles = document.getElementById('sparkles');
  const invitationUrl = 'https://sites.google.com/view/melannivaleria-xv-2026/home';
  let started = false;

  function makeSparkles() {
    const count = 85;
    for (let i = 0; i < count; i++) {
      const star = document.createElement('span');
      star.className = 'spark';
      star.style.setProperty('--x', (4 + Math.random() * 92) + '%');
      star.style.setProperty('--y', (12 + Math.random() * 76) + '%');
      star.style.setProperty('--size', (2 + Math.random() * 4) + 'px');
      star.style.setProperty('--delay', (Math.random() * 2.2) + 's');
      star.style.setProperty('--duration', (0.7 + Math.random() * 1.5) + 's');
      sparkles.appendChild(star);
    }
  }

  function openInvitation() {
    if (started) return;
    started = true;
    seal.disabled = true;
    hint.style.opacity = '0';
    stage.classList.add('opening');
    makeSparkles();
    window.setTimeout(() => stage.classList.add('leaving'), 2450);
    window.setTimeout(() => { window.location.href = invitationUrl; }, 3200);
  }
  seal.addEventListener('click', openInvitation);
  seal.addEventListener('touchend', function (event) {
    event.preventDefault();
    openInvitation();
  }, { passive: false });
})();
</script>
</body>
</html>
